name: Daily headline refresh

on:
  schedule:
    # 7:35am Brisbane / AEST. Brisbane does not use daylight saving time.
    - cron: "35 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-headline-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh headline board
        run: python tools/refresh_site.py

      - name: Commit refreshed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/headlines.json assets/data/headline-images data/archive docs/site-map.md *.html
          if git diff --cached --quiet; then
            echo "No headline changes to commit."
          else
            git commit -m "Refresh daily headline board"
            git push
          fi
